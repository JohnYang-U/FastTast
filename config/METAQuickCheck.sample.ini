; ===========================================================================
;  METAQuickCheck 配置模板
;
;  用法: 拷到 METAQuickCheck.exe 同目录, 改名为 METAQuickCheck.ini
;        程序首次运行会自动生成一份; 这份是带注释的模板
;
;  [FlagValues] 段由界面里的「测试项开关」页自动维护, 一般不用手改
; ===========================================================================

[Env]
; META 运行时目录: 填 MTK 提供的运行库目录(里面有 METACalibrationLibrary.dll)
; 留空则用编译时烘焙的默认值; 也可以用环境变量 META_RUNTIME_DIR
RuntimeDir=

; 连接方式: 0=自动扫描(推荐)  1=指定串口  2=DUT 已在 META 模式
ConnMode=0

; ConnMode=1 时生效: 指定串口号(只写数字, 不要写 COM)
PreloadPort=0
KernelPort=0

; 会话槽号 = meta_handle, 0..31。单工位用 0 即可。
Slot=0

; 连接超时(毫秒)
Timeout=120000

; 连接后是否继续 AP→Modem。做校准必须 true; 只做 AP 侧测试可以 false
ConnectModem=true

[Paths]
; META 校准配置文件(*.cfg) —— 必需, 通常由 META 工具或产线配置提供
Cfg=
; 初始值文件(*.ini), 可空
Ini=
; 校准日志(*.log)
Log=
; 校准数据输出(*.cal)
Out=
; 校准报告目录(生成 *.csv)
CalRes=

[Inst]
; 各制式使用的仪器型号编号, 0 = 该制式不测
; 编号在界面「校准 / 综测」页的仪器下拉框里直接选即可, 一般不用手填
Lte=2
Nr=2
Gge=2
Wcdma=2
C2k=2
Td=2
